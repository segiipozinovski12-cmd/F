# Optional APNs configuration. Mount a provider key; never commit it.
services:
  relay:
    environment:
      VO1D_APNS_KEY_ID: ${VO1D_APNS_KEY_ID:?Set your Apple APNs key ID}
      VO1D_APNS_TEAM_ID: ${VO1D_APNS_TEAM_ID:?Set your Apple Team ID}
      VO1D_APNS_TOPIC: ${VO1D_APNS_TOPIC:?Set the application bundle identifier}
      VO1D_APNS_KEY_PATH: /run/apns/provider.p8
    volumes:
      - ${VO1D_APNS_KEY_FILE:?Set the path to your provider p8 key}:/run/apns/provider.p8:ro
