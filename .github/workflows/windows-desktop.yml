name: Windows Desktop EXE
# parity-validation-4

on:
  push:
    branches:
      - codex/windows-desktop
    paths:
      - "windows/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install official libsignal runtime
        shell: pwsh
        working-directory: windows/VO1D.SignalBridge
        run: |
          npm install --omit=dev --no-audit --no-fund
          node bridge.js --selftest
      - name: Embed Signal runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD "artifacts/signal-runtime"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Copy-Item (Get-Command node).Source (Join-Path $runtime "node.exe")
          Copy-Item "windows/VO1D.SignalBridge/bridge.js" (Join-Path $runtime "bridge.js")
          Copy-Item "windows/VO1D.SignalBridge/node_modules" (Join-Path $runtime "node_modules") -Recurse
          New-Item -ItemType Directory -Force "windows/VO1D.Desktop/Resources" | Out-Null
          $zip = Join-Path $PWD "windows/VO1D.Desktop/Resources/SignalBridge.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$runtime/*" -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "SignalBridge.zip was not produced" }
          Get-Item $zip | Format-List Name,Length
      - name: Restore
        run: dotnet restore windows/VO1D.Desktop/VO1D.Desktop.csproj
      - name: Publish single-file EXE
        run: dotnet publish windows/VO1D.Desktop/VO1D.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/VO1D-Windows
      - name: Smoke-check artifact
        shell: pwsh
        run: |
          if (!(Test-Path "artifacts/VO1D-Windows/VO1D.exe")) { throw "VO1D.exe was not produced" }
          Get-Item "artifacts/VO1D-Windows/VO1D.exe" | Format-List Name,Length,LastWriteTime
      - name: Launch smoke-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/VO1D-Windows/VO1D.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "VO1D.exe exited during launch smoke-test with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Interactive composer smoke-test
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win32Focus {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
          }
          "@
          $env:VO1D_UI_PREVIEW = "1"
          $p = Start-Process -FilePath "artifacts/VO1D-Windows/VO1D.exe" -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              $p.Refresh()
              if ($p.MainWindowHandle -ne 0) { break }
            }
            if ($p.HasExited) { throw "VO1D.exe exited before UI automation" }
            if ($p.MainWindowHandle -eq 0) { throw "VO1D main window was not found" }
            [Win32Focus]::ShowWindow($p.MainWindowHandle, 9) | Out-Null
            [Win32Focus]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 2

            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $windowCond = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
            $window = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $windowCond)
            if ($null -eq $window) { throw "VO1D automation window not found" }

            $composerCond = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::AutomationIdProperty, "VO1D_Composer")
            $composer = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $composerCond)
            if ($null -eq $composer) { throw "VO1D composer automation element not found" }

            $pattern = $composer.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
            $probe = "VO1D composer input smoke test 2026"
            $pattern.SetValue($probe)
            Start-Sleep -Milliseconds 400
            $readBack = $composer.GetCurrentPropertyValue([System.Windows.Automation.ValuePattern]::ValueProperty)
            if ($readBack -ne $probe) { throw "Composer input mismatch: '$readBack'" }

            New-Item -ItemType Directory -Force "artifacts/VO1D-Windows" | Out-Null
            Set-Content -Path "artifacts/VO1D-Windows/VO1D-ui-smoke.txt" -Value "COMPOSER_OK=$readBack"
          }
          finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Capture UI preview
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win32Capture {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr hWnd, int nCmdShow);
          }
          "@
          $env:VO1D_UI_PREVIEW = "1"
          $p = Start-Process -FilePath "artifacts/VO1D-Windows/VO1D.exe" -PassThru

          $deadline = (Get-Date).AddSeconds(15)
          do {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
          } while (!$p.HasExited -and $p.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)

          if ($p.HasExited) { throw "VO1D.exe exited before UI capture with code $($p.ExitCode)" }
          if ($p.MainWindowHandle -eq 0) { throw "VO1D main window was not created in time" }

          [Win32Capture]::ShowWindowAsync($p.MainWindowHandle, 9) | Out-Null
          [Win32Capture]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep -Milliseconds 800

          $rect = New-Object Win32Capture+RECT
          if (![Win32Capture]::GetWindowRect($p.MainWindowHandle, [ref]$rect)) { throw "Could not read VO1D window bounds" }

          $width = [Math]::Max(1, $rect.Right - $rect.Left)
          $height = [Math]::Max(1, $rect.Bottom - $rect.Top)
          $bmp = New-Object System.Drawing.Bitmap $width, $height
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.CopyFromScreen($rect.Left, $rect.Top, 0, 0, (New-Object System.Drawing.Size $width, $height))
          $bmp.Save((Join-Path $PWD "artifacts/VO1D-Windows/VO1D-preview.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          $gfx.Dispose()
          $bmp.Dispose()

          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VO1D-Windows-x64
          path: |
            artifacts/VO1D-Windows/VO1D.exe
            artifacts/VO1D-Windows/VO1D-preview.png
            artifacts/VO1D-Windows/VO1D-ui-smoke.txt
          if-no-files-found: error
