name: VO1D · Native photo gallery
on:
  push:
    branches: [codex/vo1d-gallery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Prepare native frameworks
        run: python3 scripts/generate_project.py
      - name: Render actual interface and all five gifts
        run: |
          set -o pipefail
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl status_bar "$simulator_id" override --time '9:41' --batteryState charged --batteryLevel 100
          xcodebuild test -project ios/VO1DMessenger.xcodeproj -scheme VO1DMessenger -destination "platform=iOS Simulator,id=$simulator_id" -parallel-testing-enabled NO -derivedDataPath build -resultBundlePath gallery.xcresult -only-testing:VO1DMessengerTests/CollectionRenderingTests/testRenderActualProfileStorefrontAndArtwork CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS="$PWD/scripts/Simulator.entitlements" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES LIBRARY_SEARCH_PATHS="$(pwd)/Vendor/libsignal/artifacts/iphonesimulator/Debug" | tee gallery-build.log
      - name: Export high quality photos
        if: always()
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x.get("isAvailable") and "iPhone" in x["name"]))')
          app_data=$(xcrun simctl get_app_container "$simulator_id" io.vo1d.messenger data 2>/dev/null || true)
          if [ -z "$app_data" ]; then exit 0; fi
          export VO1D_GALLERY_DOCUMENTS="$app_data/Documents"
          python3 - <<'PY'
          import os, json, struct, subprocess
          from pathlib import Path
          output=Path('gallery-photos'); output.mkdir(exist_ok=True)
          rows=[]
          for source in sorted(Path(os.environ['VO1D_GALLERY_DOCUMENTS']).glob('collection-preview-*.png')):
              name=source.stem.removeprefix('collection-preview-')+'.jpg'
              width,height=struct.unpack('>II',source.read_bytes()[16:24])
              subprocess.run(['sips','-s','format','jpeg','-s','formatOptions','95',str(source),'--out',str(output/name)],check=True,stdout=subprocess.DEVNULL)
              rows.append({'name':name,'width':width,'height':height})
          (output/'manifest.json').write_text(json.dumps(rows,indent=2))
          print('Exported',len(rows),'native screenshots and 3D renders.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: VO1D-photo-gallery
          path: gallery-photos/
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: gallery-diagnostics
          path: gallery-build.log
