name: VO1D · Build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -v
      - name: Build Railway Docker image
        run: docker build -t vo1d-relay:ci server
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code ios/VO1DMessenger.xcodeproj
      - name: Build Debug for iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild build -project ios/VO1DMessenger.xcodeproj -scheme VO1DMessenger -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - name: Build release for device
        run: xcodebuild build -project ios/VO1DMessenger.xcodeproj -scheme VO1DMessenger -configuration Release -destination 'generic/platform=iOS' -derivedDataPath release CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-results
          path: xcodebuild.log
      - uses: actions/upload-artifact@v4
        with:
          name: VO1D-iPhone-Simulator
          path: build/Build/Products/Debug-iphonesimulator/VO1DMessenger.app
