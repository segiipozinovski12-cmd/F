name: VO1D · Build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r server/requirements.lock
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m unittest discover -s server/tests -v
      - name: Audit pinned Python dependencies
        run: |
          pip install --require-hashes -r tools/audit-requirements.lock
          mkdir -p build-evidence
          pip-audit -r server/requirements.lock --disable-pip --no-deps -f json -o build-evidence/python-audit.json
          python scripts/build_manifest.py
      - name: Upload dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relay-dependency-evidence
          path: build-evidence/

      - name: Build Railway Docker image
        run: |
          docker build -t vo1d-relay:ci server
          docker run --rm --entrypoint python vo1d-relay:ci -c "from app import Relay; Relay('/tmp/smoke.sqlite3')"
      - name: Validate reverse proxy and onion configuration
        run: |
          docker run --rm -e VO1D_DOMAIN=ci.invalid -v "$PWD/server/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker build -t vo1d-onion:ci deploy/tor
          docker run --rm --add-host relay:127.0.0.1 vo1d-onion:ci --verify-config -f /etc/tor/torrc
  ios:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: iOS · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Verify generated project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code ios/VO1DMessenger.xcodeproj
      - name: Build Debug for iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild build -project ios/VO1DMessenger.xcodeproj -scheme VO1DMessenger -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS="$PWD/scripts/Simulator.entitlements" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES | tee xcodebuild.log
      - name: Build and validate Debug for physical iPhone
        run: |
          xcodebuild build -project ios/VO1DMessenger.xcodeproj -scheme VO1DMessenger -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath device-debug CODE_SIGNING_ALLOWED=NO
          python3 scripts/validate_ios_bundle.py device-debug/Build/Products/Debug-iphoneos/VO1DMessenger.app
      - name: Run cryptography and privacy tests
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d.get("isAvailable") and "iPhone" in d["name"]))')
          xcodebuild test -project ios/VO1DMessenger.xcodeproj -scheme VO1DMessenger -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath build -resultBundlePath privacy-tests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS="$PWD/scripts/Simulator.entitlements" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES LIBRARY_SEARCH_PATHS="$(pwd)/Vendor/libsignal/artifacts/iphonesimulator/Debug"
      - name: Build release for device
        run: |
          xcodebuild build -project ios/VO1DMessenger.xcodeproj -scheme VO1DMessenger -configuration Release -destination 'generic/platform=iOS' -derivedDataPath release CODE_SIGNING_ALLOWED=NO
          python3 scripts/validate_ios_bundle.py release/Build/Products/Release-iphoneos/VO1DMessenger.app
      - name: Capture first-run interface for visual review
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d.get("isAvailable") and "iPhone" in d["name"]))')
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl status_bar "$simulator_id" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$simulator_id" build/Build/Products/Debug-iphonesimulator/VO1DMessenger.app
          xcrun simctl launch "$simulator_id" io.vo1d.messenger
          sleep 3
          mkdir -p build-evidence
          xcrun simctl io "$simulator_id" screenshot build-evidence/first-run.png
      - name: Upload interface preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VO1D-first-run-interface-${{ matrix.os }}
          path: build-evidence/first-run.png
      - name: Package unsigned device build and dependency evidence
        run: |
          python3 scripts/build_manifest.py
          ditto -c -k --keepParent release/Build/Products/Release-iphoneos/VO1DMessenger.app VO1D-unsigned-device.zip
          shasum -a 256 VO1D-unsigned-device.zip > build-evidence/device-sha256.txt
      - name: Attest device archive provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: VO1D-unsigned-device.zip
      - name: Upload device archive and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VO1D-unsigned-device-${{ matrix.os }}
          path: |
            VO1D-unsigned-device.zip
            build-evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: xcode-results-${{ matrix.os }}
          path: |
            xcodebuild.log
            privacy-tests.xcresult
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VO1D-iPhone-Simulator-${{ matrix.os }}
          path: build/Build/Products/Debug-iphonesimulator/VO1DMessenger.app
